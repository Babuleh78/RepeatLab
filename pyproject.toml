[project]
name = "repeatlab"
version = "0.1.0"
description = "Reproducible repeat-purchase research laboratory"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
]

[tool.uv]
required-version = "==0.13.5"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
